# Configuracion del CLI de Alembic. La app NO lee este archivo: app/schema.py arma su
# propio Config en memoria, asi que el esquema se aplica igual aunque el .ini no este
# en la imagen.
#
#   uv run alembic revision -m "descripcion"   # crea una migracion vacia
#   uv run alembic upgrade head                # la aplica
#   uv run alembic current                     # que version tiene la base
#
# NO se usa --autogenerate: el proyecto no tiene modelos de SQLAlchemy de donde derivar
# el esquema. Las migraciones se escriben a mano con op.execute().

[alembic]
script_location = migrations

# Para que `from config import settings` funcione al correr el CLI desde la raiz.
prepend_sys_path = .

# Sin esto, `alembic revision` (sin --autogenerate) no ejecuta migrations/env.py, asi que
# el hook `process_revision_directives` que numera los archivos 0002, 0003... nunca corre
# y Alembic vuelve a su hash aleatorio por default. Efecto colateral: generar una revision
# ahora necesita Postgres arriba (env.py abre una conexion), igual que ya lo necesita
# probar la migracion antes de commitear.
revision_environment = true

# sqlalchemy.url NO va aca a proposito: es un secreto y este archivo esta versionado.
# migrations/env.py la toma de settings.sqlalchemy_url.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
