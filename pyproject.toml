[project]
name = "review-ingles"
version = "0.1.0"
description = "Practica de pronunciacion en ingles con Azure Speech Pronunciation Assessment"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "python-multipart>=0.0.20",
    "python-dotenv>=1.0",
    "jinja2>=3.1",
    "azure-cognitiveservices-speech>=1.40",
    "langgraph>=0.2",
    "langchain-google-genai>=2.0",
    "langsmith[claude-agent-sdk]>=0.10.10",
    "langchain>=0.3",
    "psycopg[binary]>=3.2",
    # Ingesta de textos de lectura: httpx hace los requests asíncronos y BeautifulSoup lee
    # el HTML de la fuente. Van acá y no en dev porque el job corre en producción.
    "httpx>=0.28.1",
    "beautifulsoup4>=4.13",
    "structlog>=25.4",
    "pydantic-settings>=2.14.2",
]

# Herramientas de testing / calidad: NO van a la imagen de producción. El
# Dockerfile las excluye con `uv sync --no-dev`; solo se instalan en los stages
# development y test.
[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "hypothesis>=6.164.0",
    "mutmut>=3.7.0",
    "mypy>=2.3.0",
    "behave>=1.3.3",
    "pytest-asyncio>=1.0",
    # Explícito y no transitivo de mutmut: el stage `test` del Dockerfile y el CI
    # dependen de que exista, así que no puede colarse por la puerta de atrás.
    "coverage>=7.6",
    "ruff>=0.16",
]

# asyncio_mode = "auto" para no decorar cada test asincrono con @pytest.mark.asyncio.
# Los tests de app/reading lo son porque el modulo corre dentro del event loop.
[tool.pytest.ini_options]
asyncio_mode = "auto"
# Los tests viven en tests/, espejo de la estructura de app/. Fijarlo evita que pytest
# recorra .venv o docs buscando archivos que parezcan tests.
testpaths = ["tests"]
markers = [
    "integration: necesita infraestructura real (Postgres, Azure, red). Excluido del job de unitarios.",
]

# --- coverage --------------------------------------------------------------------------
# `source` incluye config.py porque es el punto único de envs: si deja de estar cubierto,
# es que algo lo dejó de usar.
[tool.coverage.run]
source = ["app", "config"]
branch = true

[tool.coverage.report]
show_missing = true
# Piso duro: por debajo de esto el build falla. El total hoy es 70.35 % contando ramas, así
# que el margen son ~2 puntos (unas 36 líneas o ramas). Es apretado a propósito: la idea es
# que agregar código sin tests duela enseguida. La contracara es que un commit grande puede
# tener que traer sus tests en el mismo PR — que es justamente lo que se busca.
# Lo que falta cubrir son los adaptadores reales (azure_client, sources/engoo, los
# repository de Postgres), que necesitan tests de integración.
fail_under = 68
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

# --- ruff ------------------------------------------------------------------------------
# Linter. NO se corre el formatter (`ruff format`) en CI: reformatear todo el proyecto es un
# cambio de otro PR, no un efecto colateral de agregar el linter.
[tool.ruff]
# 100 es el ancho que ya usa el código; bajarlo obligaría a recortar comentarios que
# explican decisiones, que es justo lo que no queremos perder.
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes: imports sin usar, nombres indefinidos
    "I",       # isort: orden de imports
    "B",       # bugbear: bugs comunes
    "UP",      # pyupgrade: sintaxis vieja para el Python que declaramos
    "RUF",     # reglas propias de ruff
]
ignore = [
    # `def endpoint(x = Depends(...))` es EL patrón de inyección de FastAPI. La regla existe
    # para el default mutable clásico; acá marcaría 18 falsos positivos en server.py.
    "B008",
]

[tool.ruff.lint.per-file-ignores]
# Los dobles de test declaran atributos de clase a propósito para imitar objetos reales
# (p. ej. `headers: dict = {}` en un request falso); no son estado compartido accidental.
"tests/**" = ["RUF012"]
# graph.py son los prompts del tutor, no código: cortar una línea para que entre en 100
# columnas cambia el texto que recibe el LLM. El límite de ancho no aplica.
"app/conversation/graph.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app", "config"]

# --- mypy ------------------------------------------------------------------------------
# Tipado estatico con "gradual typing": la base global es permisiva para que el chequeo
# pase hoy y pueda bloquear el CI desde el dia uno, y `strict` se activa por modulo en los
# que ya lo cumplen. Un modulo que entra a la lista de estrictos no puede volver a salir
# sin que alguien lo note en el diff — que es el punto.
#
#   uv run mypy app config.py
[tool.mypy]
python_version = "3.11"
# Estos tres son los que atrapan bugs de verdad y ya se cumplen en todo el proyecto.
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true

# El SDK de Azure no publica stubs ni py.typed: sin esto, cada import es un error y el
# ruido tapa los hallazgos reales. Es la unica dependencia sin tipos del proyecto.
[[tool.mypy.overrides]]
module = ["azure.*"]
ignore_missing_imports = true

# --- modulos ya estrictos --------------------------------------------------------------
# Objetivo: que esta lista crezca hasta cubrir todo `app`. Lo que falta hoy es
# cmd/server.py, speech/* (azure_client, scoring, assessment, service), conversation/graph
# y service, reading/service y repository, storage y ratelimit.
#
# OJO: aca NO se puede poner `strict = true`. En una seccion per-module, mypy lo aplica al
# proyecto entero en vez de a estos modulos (probado: pasa de 7 errores a 56). Hay que
# expandir a mano los flags que `strict` agrupa, que es lo que sigue.
[[tool.mypy.overrides]]
module = [
    "app.limits.*",
    "app.feedback.*",
    "app.conversation.messages",
    "app.conversation.model",
    "app.conversation.repository",
    "app.conversation.schemas",
    "app.reading.model",
    "app.reading.excerpt",
    "app.reading.ingest",
    "app.reading.scheduler",
    "app.reading.sources.*",
    "app.logconfig",
    "config",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_any_generics = true
disallow_subclassing_any = true
check_untyped_defs = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true
