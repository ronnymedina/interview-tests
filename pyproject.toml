[project]
name = "review-ingles"
version = "0.1.0"
description = "Practica de pronunciacion en ingles con Azure Speech Pronunciation Assessment"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "python-multipart>=0.0.20",
    "python-dotenv>=1.0",
    "azure-cognitiveservices-speech>=1.40",
    "langgraph>=0.2",
    "langchain-google-genai>=2.0",
    "langsmith[claude-agent-sdk]>=0.10.10",
    "langchain>=0.3",
    "psycopg[binary]>=3.2",
]

# Herramientas de testing / calidad: NO van a la imagen de producción. El
# Dockerfile las excluye con `uv sync --no-dev`; solo se instalan en los stages
# development y test.
[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "hypothesis>=6.164.0",
    "mutmut>=3.7.0",
    "mypy>=2.3.0",
    "behave>=1.3.3",
]
