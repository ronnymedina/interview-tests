# Pipeline de CI.
#
# La suite NO se corre con un `pip install` propio del runner: se corre construyendo el
# stage `test` del Dockerfile. Así el CI y `docker build --target test .` en tu máquina
# ejecutan exactamente el mismo entorno (mismo Python, mismo uv.lock), y un fallo en CI se
# reproduce local con un solo comando.
#
# Orden: lint, tipos, tests+coverage e integración en paralelo (los cuatro bloquean) ->
# imagen de producción.

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Un push nuevo a la misma rama cancela el run anterior: no tiene sentido pagar CI por un
# commit que ya quedó atrás.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------------------------------
  # Lint. Va en paralelo a los tests, no antes: un error de estilo no debe tapar un test
  # roto, y al revés. Usa ruff directo (no el Dockerfile) porque tarda segundos.
  # -------------------------------------------------------------------------------------
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/ruff-action@v3
        with:
          args: check --output-format=github

  # -------------------------------------------------------------------------------------
  # Tipado estático. Los type hints no hacen nada en runtime; su valor lo desbloquea este
  # chequeo, y corriendo acá ningún PR entra sin pasarlo. La config (gradual typing, con
  # `strict` ya activo en los módulos que lo cumplen) está en pyproject.toml.
  # -------------------------------------------------------------------------------------
  types:
    name: Tipos (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --frozen

      # No se chequea tests/: los dobles usan duck typing a propósito y anotarlos para
      # mypy los volvería más rígidos que el código que prueban.
      - run: uv run mypy app config.py

  # -------------------------------------------------------------------------------------
  # Tests unitarios + coverage. El umbral (fail_under) está en pyproject.toml: si la
  # cobertura baja del piso, `coverage report` sale con código != 0 y el build falla acá.
  # -------------------------------------------------------------------------------------
  test:
    name: Tests unitarios y coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Construir el stage test (pytest + coverage)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          push: false
          # El cache de GitHub evita reinstalar las deps en cada run; solo se invalida
          # cuando cambian pyproject.toml o uv.lock.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -------------------------------------------------------------------------------------
  # Tests de integración. El job `test` de arriba corre dentro del stage `test` del
  # Dockerfile, que no levanta infraestructura: sus 162 tests hacen `assert "..." in sql`
  # sobre el TEXTO de las migraciones. El único que ejecuta SQL de verdad es
  # `test_upgrade_head_crea_las_tablas` (marcado `integration`), y por eso queda excluido
  # de ese stage. Sin este job, un `op.execute("ALTER TABEL ...")` con un typo pasa ruff,
  # pasa mypy, pasa los 162 tests de texto, la imagen se construye verde, y el contenedor
  # entra en crash-loop en Railway: el lifespan corre las migraciones sin try/except a
  # propósito (si fallan, el arranque se cae). Esta política necesita su propia compuerta
  # en CI, no solo en producción.
  #
  # Corre directo con `uv run` (como `types`), no construyendo el Dockerfile: el stage
  # `test` de la imagen no tiene forma de hablarle a un servicio hermano del runner, y acá
  # sí hace falta un Postgres real.
  # -------------------------------------------------------------------------------------
  integration:
    name: Tests de integración (Postgres real)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: review
          POSTGRES_PASSWORD: review
          POSTGRES_DB: review_ingles
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U review -d review_ingles"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      # Puerto 5432 directo, el default de config.py: el 5434 del docker-compose local es
      # solo para no chocar con otros Postgres del developer, y ese problema no existe acá.
      DATABASE_URL: postgresql://review:review@localhost:5432/review_ingles
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --frozen

      - run: uv run pytest -m integration

  # -------------------------------------------------------------------------------------
  # La imagen que realmente se despliega. Se construye solo si los tests pasaron, para no
  # publicar nunca una imagen verde sobre una suite roja. `integration` bloquea igual que
  # los demás: dejar pasar una migración rota a producción es justo lo que la política de
  # "si el arranque falla, no arranca" vino a prevenir, y ese gate tiene que estar antes
  # del deploy, no ser informativo después.
  # -------------------------------------------------------------------------------------
  build:
    name: Imagen de producción
    runs-on: ubuntu-latest
    needs: [lint, types, test, integration]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Construir el stage production
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
